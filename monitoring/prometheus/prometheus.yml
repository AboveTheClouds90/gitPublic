global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The VM itself (CPU, RAM, disk, network), from prometheus-node-exporter
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  # llama.cpp llama-server, needs to be started with --metrics.
  # Use the server's IP instead of localhost if it runs on another machine.
  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          model: glm-5.3

  # vLLM exposes /metrics by default on its API port.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["<vllm-host>:8000"]
