global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # llama.cpp llama-server (GLM-5.3) on this machine, started with --metrics
  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          server: local
          model: glm-5.3
